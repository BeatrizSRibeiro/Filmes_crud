<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de Filme</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <header><h1>🎬 Catálogo de Filmes</h1></header>
    <main>
        <div class="card">
            <h2 th:text="${filme.id == null} ? 'Novo filme' : 'Editar filme'"></h2>

            <form th:action="@{/filmes/salvar}" th:object="${filme}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" th:field="*{titulo}"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" th:field="*{genero}"
                           th:classappend="${#fields.hasErrors('genero')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                </div>

                <div class="campo">
                    <label for="nota">Nota (0 a 10)</label>
                    <input type="number" step="0.1" id="nota" th:field="*{nota}"
                           th:classappend="${#fields.hasErrors('nota')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></span>
                </div>

                <div class="campo">
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" th:field="*{ano}"
                           th:classappend="${#fields.hasErrors('ano')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></span>
                </div>

                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-cancelar" th:href="@{/filmes}">Cancelar</a>
            </form>
        </div>
    </main>
</body>
</html>
